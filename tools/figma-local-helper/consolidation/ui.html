<!doctype html><html lang="en"><meta charset="utf-8"><style>
body{font:13px -apple-system,sans-serif;background:#f7f4ec;color:#213d39;margin:20px}h1{font-size:20px}p{line-height:1.5}button{font:inherit;background:#176c60;color:white;border:0;border-radius:9px;padding:12px;margin:4px 4px 4px 0;cursor:pointer}textarea{width:100%;height:310px;box-sizing:border-box;font:11px monospace}#status{font-weight:600}
</style><h1>SpeechCoach · Page 1 Kit</h1><p>Keep the original visual direction. Build a compact reference for reusable components, templates and speaking practice.</p>
<button data-op="inspect">Inspect original</button><button data-op="build">Build reusable kit</button><button data-op="finish">Remove Page 2</button><button data-op="focus">Show kit</button><button data-op="review">Export review</button><p id="status">Inspect before building.</p><textarea aria-label="Kit report" id="report" readonly></textarea><button id="save">Save report</button>
<script>
let last={},archive=[];const status=document.getElementById('status'),report=document.getElementById('report');
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{status.textContent='Working…';parent.postMessage({pluginMessage:{op:b.dataset.op}},'*')});
function zip(files){
 const enc=new TextEncoder(),parts=[],central=[];let offset=0;
 const crc=bytes=>{let c=0xffffffff;for(const b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^0xffffffff)>>>0;};
 for(const file of files){
  const name=enc.encode(file.name),bytes=file.bytes,sum=crc(bytes),header=new Uint8Array(30+name.length),v=new DataView(header.buffer);
  v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,sum,true);v.setUint32(18,bytes.length,true);v.setUint32(22,bytes.length,true);v.setUint16(26,name.length,true);header.set(name,30);
  const entry=new Uint8Array(46+name.length),d=new DataView(entry.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,sum,true);d.setUint32(20,bytes.length,true);d.setUint32(24,bytes.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);entry.set(name,46);
  parts.push(header,bytes);central.push(entry);offset+=header.length+bytes.length;
 }
 const size=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);
 return new Blob([...parts,...central,end],{type:"application/zip"});
}

function save(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click()}
document.getElementById('save').onclick=()=>save(new Blob([report.value],{type:'application/json'}),'speechcoach-page-one-kit-report.json');
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.kind==='png'){archive.push({name:m.name+'.png',bytes:new Uint8Array(m.bytes)});return}if(m.operation==='review'&&archive.length){archive.push({name:'report.json',bytes:new TextEncoder().encode(JSON.stringify(m,null,2))});save(zip(archive),'speechcoach-page-one-kit-review.zip');archive=[];}last=m;status.textContent=m.error?'Stopped: '+m.error:'Done · '+m.operation;report.value=JSON.stringify(m,null,2)};
</script></html>
