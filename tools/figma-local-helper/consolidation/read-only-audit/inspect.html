<!doctype html><meta charset="utf-8"><title>Read-only readiness audit</title><style>body{font:14px system-ui;padding:20px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>SpeechCoach read-only audit</h1><p id="status">Inspecting the verified file and Page 1. No design changes.</p><button id="download" disabled>Download audit</button><pre id="summary"></pre><script>
const files=[];let report;
function zip(files){
 const enc=new TextEncoder(),parts=[],central=[];let offset=0;
 const crc=bytes=>{let c=0xffffffff;for(const b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^0xffffffff)>>>0;};
 for(const file of files){
  const name=enc.encode(file.name),bytes=file.bytes,sum=crc(bytes),header=new Uint8Array(30+name.length),v=new DataView(header.buffer);
  v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,sum,true);v.setUint32(18,bytes.length,true);v.setUint32(22,bytes.length,true);v.setUint16(26,name.length,true);header.set(name,30);
  const entry=new Uint8Array(46+name.length),d=new DataView(entry.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,sum,true);d.setUint32(20,bytes.length,true);d.setUint32(24,bytes.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);entry.set(name,46);
  parts.push(header,bytes);central.push(entry);offset+=header.length+bytes.length;
 }
 const size=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);
 return new Blob([...parts,...central,end],{type:"application/zip"});
}

onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.kind==='progress'){document.getElementById('status').textContent=m.text;return;}if(m.kind==='error'){document.getElementById('status').textContent=m.error;return;}if(m.kind==='image'){files.push({name:'images/'+m.hash,bytes:new Uint8Array(m.bytes)});return;}if(m.kind==='report'){report=m.report;files.push({name:'report.json',bytes:new TextEncoder().encode(JSON.stringify(report,null,2))});document.getElementById('status').textContent='Inspection complete. No document edits.';document.getElementById('summary').textContent=JSON.stringify({file:report.fileKey,page:report.page,nodes:report.nodes.length,variables:report.variables.length,images:report.images.length},null,2);document.getElementById('download').disabled=false;}};
document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(zip(files));a.download='speechcoach-readonly-audit-2026-10-21.zip';a.click();};
</script>
